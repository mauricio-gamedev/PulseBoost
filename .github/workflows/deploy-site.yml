name: Deploy MiojoPlays Site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle official Mio assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/mauricio-gamedev/dc-bot/main/assets/mio-character.webp \
            --output site/assets/mio-character.webp
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/mauricio-gamedev/dc-bot/main/assets/miojo-seal-static.png \
            --output site/assets/miojo-seal-static.png
          test -s site/assets/mio-character.webp
          test -s site/assets/miojo-seal-static.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
